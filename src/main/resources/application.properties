spring.application.name=yinjie
server.port=8090
server.address=127.0.0.1
# Dev-friendly: serve the live static folder first, fall back to the packaged classpath copy.
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
logging.level.root=INFO
# Default tuning shortcut: standard is documented in README (E2,A2,D3,G3,B3,E4).
